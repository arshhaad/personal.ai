services:
  backend:
    build:
      context: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DJANGO_DB_PATH: /data/db.sqlite3
      DJANGO_MEDIA_ROOT: /media
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data
      - backend_media:/media

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    env_file:
      - path: ./frontend/.env
        required: false
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_data:
  backend_media:
